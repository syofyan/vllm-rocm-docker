name: Build and Push Docker Image to Docker Hub

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'

env:
  DOCKER_IMAGE: kapteng/vllm-rocm
  VLLM_VERSION: v0.6.5

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          docker system prune -af
          df -h

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Clone vLLM source
        run: |
          git clone --depth 1 --branch ${{ env.VLLM_VERSION }} \
            --recurse-submodules --shallow-submodules \
            https://github.com/vllm-project/vllm.git /tmp/vllm

      - name: Patch Dockerfile.rocm
        run: |
          python3 << 'EOF'
          import re
          with open('/tmp/vllm/Dockerfile.rocm', 'r') as f:
              content = f.read()
          
          # 1. Replace PyTorch nightly with stable 2.5.1
          old_pattern = r'# Install torch == 2\.6\.0 on ROCm.*?esac'
          new_block = """# Install PyTorch 2.5.1 stable for ROCm 6.2
          RUN --mount=type=cache,target=/root/.cache/pip \\
              python3 -m pip uninstall -y torch torchvision \\
              && python3 -m pip install --no-cache-dir \\
                  torch==2.5.1 \\
                  torchvision==0.20.1 \\
                  --index-url https://download.pytorch.org/whl/rocm6.2"""
          
          content = re.sub(old_pattern, new_block, content, flags=re.DOTALL)
          
          # 2. Add setuptools_scm before vLLM build
          content = content.replace(
              'python3 -m pip install -Ur requirements-rocm.txt',
              'python3 -m pip install setuptools_scm && python3 -m pip install -Ur requirements-rocm.txt'
          )
          
          with open('/tmp/vllm/Dockerfile.rocm', 'w') as f:
              f.write(content)
          
          print("Dockerfile.rocm patched successfully")
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: /tmp/vllm
          file: /tmp/vllm/Dockerfile.rocm
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_FA=0
            BUILD_TRITON=1
            PYTORCH_ROCM_ARCH=gfx1100
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image info
        run: |
          echo "✅ Docker image built and pushed successfully!"
          echo "📦 Image: ${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.tag }}"
          echo "🔗 Link: https://hub.docker.com/r/${{ env.DOCKER_IMAGE }}"
